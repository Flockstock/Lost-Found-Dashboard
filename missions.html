<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Board · Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar"></aside>

    <main>
        <header class="page-head">
            <div class="page-head-text">
                <h2>Mission Board</h2>
                <p>What matters today? Finish it and it becomes a star.</p>
            </div>
            <div class="header-icons">
                <span class="date"></span>
                <button type="button" class="sidebar-open-btn" aria-label="Show menu">☰</button>
                <button type="button" class="theme-toggle" aria-label="Switch light or dark">❇</button>
            </div>
        </header>

        <div class="board">
            <section class="task-list">
                <h4>New task</h4>
                <form class="add-task-form">
                    <input type="text" class="task-input" placeholder="What do you want to do?" aria-label="Task" required>
                    <input type="date" class="task-date" aria-label="Due date">
                    <textarea class="task-description" placeholder="Add a description (optional)" aria-label="Description"></textarea>
                    <label class="focus-label">What are you focusing on?</label>
                    <div class="focus-picker">
                        <button type="button" class="focus-option" data-category="Build">Build</button>
                        <button type="button" class="focus-option" data-category="Learn">Learn</button>
                        <button type="button" class="focus-option" data-category="Career">Career</button>
                        <button type="button" class="focus-option" data-category="Creative">Creative</button>
                        <button type="button" class="focus-option" data-category="Health">Health</button>
                    </div>
                    <button type="submit" class="add-task-btn">Add</button>
                </form>
            </section>

            <div class="board-lists">
                <section class="task-group">
                    <h4>Today</h4>
                    <span class="mission-progress-label"></span>
                    <div class="progress-bar" role="progressbar" aria-label="Today's progress" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-fill"></div>
                    </div>
                    <ul class="tasks" id="tasks-today"></ul>
                </section>

                <section class="task-group" id="group-carried">
                    <h4>Carried over</h4>
                    <p class="group-note">Unfinished from earlier days. They don't count toward today's progress.</p>
                    <ul class="tasks" id="tasks-carried"></ul>
                </section>

                <section class="task-group" id="group-later">
                    <h4>Later</h4>
                    <ul class="tasks" id="tasks-later"></ul>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/app.js"></script>
    <script src="js/missions.js"></script>
</body>
</html>
