<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Map · Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar"></aside>

    <main>
        <header class="page-head">
            <div class="page-head-text">
                <h2>Identity Map</h2>
                <p class="page-summary">Your time, your story</p>
            </div>
            <div class="header-icons">
                <span class="date"></span>
                <button type="button" class="sidebar-open-btn" aria-label="Show menu">☰</button>
                <button type="button" class="theme-toggle" aria-label="Switch light or dark">❇</button>
            </div>
        </header>
        <div class="identity-layout">
            <section class="identity-snapshot identity-big">
                <div class="chart-box"><canvas id="identity-chart"></canvas></div>
            </section>
            <section class="identity-breakdown">
                <h4>Where your finished tasks went</h4>
                <ul class="identity-list" id="identity-list"></ul>
                <a href="missions.html" class="explore-link">Add a task with a focus tag →</a>
            </section>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.1.2/chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/app.js"></script>
    <script src="js/identity.js"></script>
</body>
</html>
